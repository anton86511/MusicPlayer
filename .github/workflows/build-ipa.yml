name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 XcodeGen
        run: brew install xcodegen

      - name: 產生 Xcode 專案
        run: xcodegen generate

      - name: 編譯（不簽名）
        run: |
          set +e
          xcodebuild \
            -project MusicPlayer.xcodeproj \
            -scheme MusicPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          tail -40 build.log
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit $status

      - name: 打包成 IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MusicPlayer.app Payload/
          zip -qry MusicPlayer.ipa Payload

      - name: 上傳 IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-ipa
          path: MusicPlayer.ipa

      - name: 發布到 Releases（可直接下載 .ipa）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MusicPlayer.ipa \
            --target "$GITHUB_SHA" \
            --title "最新版 MusicPlayer" \
            --notes "自動打包於 $(date -u '+%Y-%m-%d %H:%M UTC')。直接下載 MusicPlayer.ipa，用 SideStore 安裝即可。"
