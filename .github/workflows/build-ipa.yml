name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 XcodeGen
        run: brew install xcodegen

      - name: 產生 Xcode 專案
        run: xcodegen generate

      - name: 編譯（不簽名）
        run: |
          set +e
          xcodebuild \
            -project MusicPlayer.xcodeproj \
            -scheme MusicPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          tail -40 build.log
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit $status

      - name: 打包成 IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MusicPlayer.app Payload/
          zip -qry MusicPlayer.ipa Payload

      - name: 上傳 IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-ipa
          path: MusicPlayer.ipa
